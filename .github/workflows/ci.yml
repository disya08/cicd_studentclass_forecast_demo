name: My first CI-file

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Downloading code from a repository
      uses: actions/checkout@v4

    - name: Downloading NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: Downloading dependencies
      run: npm install

    - name: Start tests
      run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Downloading code from a repository
      uses: actions/checkout@v4

    - name: Saving the Artifact in the System
      run: zip -r weather-report-app.zip . -x "*.git*" "node_modules/*"

    - name: Saving the Artifact in the System after archiving
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: weather-report-app.zip
        retention-days: 7
